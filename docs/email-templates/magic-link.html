<!-- Supabase → Authentication → Emails → Magic Link. See README.md in this folder. -->
<div style="margin:0; padding:0; background-color:#f5f6f4; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#222a2f;">

  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f5f6f4;">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
          style="max-width:560px; background-color:#ffffff; border-radius:20px; overflow:hidden; border:1px solid #e8e8e5;">


          <tr>
            <td style="height:7px; background-color:#3d8c3d;"></td>
          </tr>


          <tr>
            <td align="center" style="padding:32px 40px 8px 40px;">

              <img
                src="https://app.pbroundrobin.com/logo.png"
                width="90"
                height="90"
                alt="RoundRobinator"
                style="display:block; width:90px; height:90px; margin:0 auto 24px auto;"
              >

              <h1 style="margin:0; font-size:28px; line-height:36px; font-weight:750; color:#222a2f;">
                Sign in to RoundRobinator
              </h1>

            </td>
          </tr>


          <tr>
            <td align="center" style="padding:26px 40px 10px 40px;">

              <p style="margin:0 0 14px 0; font-size:16px; line-height:24px; color:#626a6e;">
                Enter this code in the app:
              </p>

              <div style="display:inline-block; background-color:#fff3ed; border:1px solid #ffd5c2; border-radius:12px; padding:16px 24px; font-size:32px; line-height:38px; font-weight:800; letter-spacing:8px; color:#222a2f; white-space:nowrap;">
                {{ .Token }}
              </div>

            </td>
          </tr>


          <tr>
            <td align="center" style="padding:18px 40px 36px 40px;">
              <p style="margin:0; font-size:13px; line-height:21px; color:#929699;">
                This code expires in one hour.<br>
                If you didn't request it, you can safely ignore this email.
              </p>
            </td>
          </tr>

        </table>


        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;">
          <tr>
            <td align="center" style="padding:20px 20px 0 20px; font-size:12px; line-height:19px; color:#a0a3a5;">
              Less organizing. More pickleball.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</div>
