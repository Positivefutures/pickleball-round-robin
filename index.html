<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#FBFAF6" />
    <!--
      `viewport-fit=cover` hands the page the whole screen where the browser is
      drawing behind the notch and the home indicator, and turns on the
      `env(safe-area-inset-*)` values that report 0 without it.

      It does NOT reclaim the strip behind the clock on a home screen app, which
      is what it was added believing. Without an
      `apple-mobile-web-app-status-bar-style` of `black-translucent` — see below,
      it is deliberate that there is none — iOS runs the opaque status bar and
      hands the page a viewport that already starts underneath it. Measured on
      an iPhone 16 Pro Max: `env(safe-area-inset-top)` inside this app is 0. Two
      releases of the fix for iOS 26's blurred top edge were sized off that
      value and were therefore zero pixels tall. What actually holds the effect
      off is that the document never scrolls — see the scroll architecture at
      the top of index.css.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      What iOS writes under the icon. Left to itself it works down a chain and
      lands on the <title> below, which is two words too long for a home screen
      and gets truncated. This pins it to the manifest's short_name instead.

      The two capable flags are for iOS old enough to predate Safari reading
      `display` out of the manifest. Modern Safari ignores them.

      Still no black-translucent status bar, and that is a decision rather than
      an omission. It is a value Apple has marked for removal, and it would put
      the clock on top of the page: on iOS 15 and later the text colour follows
      the system appearance, so in dark mode it would be white type over this
      app's cream band and unreadable. The opaque bar it leaves in place is
      painted with the theme-color above, which is that same cream.

      The cost is that `env(safe-area-inset-top)` is 0 inside this app. See the
      viewport note above; nothing is sized off that inset any more.
    -->
    <meta name="apple-mobile-web-app-title" content="RoundRobinator" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>RoundRobinator: Round Robin Generator</title>
    <meta
      name="description"
      content="Build fair pickleball round robins in seconds. Free, no ads, and no account needed."
    />

    <!--
      Share previews. iOS builds the thumbnail on its share sheet by fetching this
      page and reading og:image; with no og tags at all it showed Safari's generic
      compass instead of the robin. Messages, WhatsApp and Slack read the same
      tags.

      These URLs must be absolute — a scraper has no page context to resolve "/"
      against — which means the host is written out here as well as in APP_URL in
      src/lib/appInfo.ts. Change one and change the other. index.html is static,
      so it cannot import the constant.

      og:image is the wide og-banner.png rather than the square app icon, because
      Messages and Slack render a 1200x630 card at full width and shrink a square
      one to a thumbnail. twitter:card follows it to "summary_large_image": the
      small card would letterbox a 1.91:1 image.

      The banner is built to survive that choice on a phone. iOS square-crops the
      middle of og:image for its share sheet, so all three lines of the name, the
      tagline, the FREE / NO ADS / NO TRACKING badge and the address sit inside
      the centre 630x630. Re-cropping it that way is the check to run whenever
      the artwork is recomposed, and it is worth actually running: the artwork
      this replaced put the type hard right, and the square crop cut it to
      "Pickleba / Round Ro / Generato".

      og-banner.png still carries the old name. It is drawn artwork, not type
      laid over a template, so the rename of 2026-08-22 could not reach it from
      here and it has to be redrawn before this is what a share preview shows.

      The robin is the one thing the square loses. It sits at the left edge and
      falls outside the crop, which is the deliberate trade — the wide card is
      what Messages, Slack and Twitter render, and there the robin is present.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RoundRobinator" />
    <meta property="og:title" content="RoundRobinator: Round Robin Generator" />
    <meta
      property="og:description"
      content="Build fair pickleball round robins in seconds. Free, no ads, and no account needed."
    />
    <meta property="og:url" content="https://app.roundrobinator.com/" />
    <meta property="og:image" content="https://app.roundrobinator.com/og-banner.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The RoundRobinator robin, beside the app name"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RoundRobinator: Round Robin Generator" />
    <meta
      name="twitter:description"
      content="Build fair pickleball round robins in seconds. Free, no ads, and no account needed."
    />
    <meta name="twitter:image" content="https://app.roundrobinator.com/og-banner.png" />

    <!--
      The strip's own CSS, inline because it has to be. #top-pin is in the body
      below, and it exists to own the top of the viewport from the first frame
      so iOS 26 reads it as the app's bar and stands down. Rules that arrive
      from src/index.css arrive too late for that: the browser has already laid
      the strip's two banner images out at their natural size, and a
      full-screen robin stacked on a full-screen court is what a user sees
      instead of the app. `vite build` hides it by putting index.css in a
      render-blocking <link>, so it only ever showed on the dev server, but the
      element's contract is first-frame paint and this is what honours it.
      public/terms.html and public/privacy.html carry their own copies for the
      same reason.

      Height, hairline and artwork all mirror the banner's first rows exactly:
      the same 1px rule, the same two images at the same height, pinned and
      windowed the same way, so the eight pixels land on top of an identical
      eight and vanish. The height variable is the banner's own clamp from
      Header.tsx minus the 2px its borders keep, and the window formula is
      Header.tsx's RIGHT_ASPECT and TITLE_MIN verbatim; src/lib/topPin.test.ts
      holds this file and that one to the same numbers.

      z-index 10 is `.app-panel`'s own, and #top-pin sits later in the DOM, so
      it paints over the panel and everything trapped inside it, which is right
      because the status bar above it stays cream too. Overlays mounted outside
      the panel run z-50 and cover it, which is also right. Specificity, not
      order, is what keeps these rules over Tailwind's preflight: every
      selector here carries an id.

      The full story of why the strip exists at all is at the top of
      src/index.css, and the measurements behind it came from
      public/blurtest.html on a real iPhone.
    -->
    <style>
      #top-pin {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 8px;
        z-index: 10;
        overflow: hidden;
        pointer-events: none;
        background: #fbfaf6;
        border-top: 1px solid #d2d2d2;
        --top-pin-art: calc(clamp(110px, 26.25vw, 165px) - 2px);
        transition: opacity 150ms ease;
      }

      /* Scrolled away from the top, the strip's sliver of banner over foreign
         content read as a defect, so lib/topPin.ts fades it out — but only after
         the launch window in which iOS reads the paint and decides. Mode J of the
         blur lab is the proof this is safe. */
      #top-pin.ghost {
        opacity: 0;
      }

      #top-pin img {
        position: absolute;
        left: 0;
        top: 0;
        height: var(--top-pin-art);
        width: auto;
        max-width: none;
      }

      #top-pin > div {
        position: absolute;
        right: 0;
        top: 0;
        height: 100%;
        width: min(calc(1.3333 * clamp(110px, 26.25vw, 165px)), calc(100% - 12rem));
        overflow: hidden;
      }

      /* The strip guards a screen edge the sheet does not have. Printed, it
         would be a stray sliver of banner across the top of page one. */
      @media print {
        #top-pin {
          display: none !important;
        }
      }
    </style>

    <!--
      The one inline script in this file, and it has to be inline.

      Chrome fires beforeinstallprompt once its install criteria are met, which
      needs a service worker with a fetch handler. On a first visit the worker
      registers late enough that React is already listening. On every visit
      after that the worker is active before the page has parsed, so the event
      can arrive before the module below has even run. It is single-shot: miss
      it and there is no second chance that page view, and an Android user who
      could have had a one-tap install is sent to the written instructions for
      a browser menu instead.

      So the listener is registered here, ahead of everything, and the event is
      parked on window for useInstallPrompt to adopt when it mounts. The
      preventDefault is the same one the hook used to do: it stops Chrome's own
      banner competing with ours. The custom event covers the ordinary case
      where the prompt arrives after the app is already up.
    -->
    <script>
      window.__installPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
        window.dispatchEvent(new Event('installpromptready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__installPrompt = null;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The 8px that keeps iOS honest. iOS 26 blurs an installed app's top
         rows into the status bar unless a painted position:fixed element owns
         the top of the viewport, in which case it reads it as the app's own
         bar and stands down. This strip is that element, drawn as a copy of
         the banner's first rows so at rest it is invisible. It lives here
         rather than in React so it is painted from the first frame, because
         the decision is made at launch, and so it stands over every surface
         the app mounts. After #root on purpose: the two share a z-index and
         this one has to win. The full story is at the top of src/index.css;
         the measurements behind it came from public/blurtest.html on a real
         iPhone. -->
    <div id="top-pin" aria-hidden="true">
      <img src="/header-left.png" alt="" width="280" height="264" />
      <div><img src="/header-right.jpg" alt="" width="352" height="264" /></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
